[package]
name = "mendeleev_table"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[[bin]]
name = "mendeleev_app"
path = "src/main.rs"

[dependencies]
wasm-bindgen = "0.2"

[dependencies.web-sys]
version = "0.3"
features = [
  "CssStyleDeclaration",
  "Document",
  "DomTokenList",
  "Element",
  "Event",
  "EventTarget",
  "HtmlElement",
  "KeyboardEvent",
  "MouseEvent",
  "Node",
  "Window",
  "console",
]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
slint = "1.8"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
