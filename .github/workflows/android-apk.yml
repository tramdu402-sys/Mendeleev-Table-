name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build offline Android APK
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          PLATFORM_DIR=$(ls -d "$SDK"/platforms/android-[0-9]* | sort -V | tail -n 1)
          ANDROID_JAR="$PLATFORM_DIR/android.jar"
          BUILD_TOOLS=$(find "$SDK/build-tools" -maxdepth 1 -mindepth 1 -type d | grep -v 'rc' | sort -V | tail -n 1)

          echo "Using platform: $PLATFORM_DIR"
          echo "Using build-tools: $BUILD_TOOLS"

          rm -rf build
          mkdir -p build/assets \
                   build/res/drawable \
                   build/res/mipmap-anydpi-v26 \
                   build/res/mipmap-xxxhdpi \
                   build/src/com/mendeleev/table3d \
                   build/classes \
                   build/dex

          cp index.html build/assets/index.html

          # Fallback PNG icon (AMOLED black + sharp orange frame)
          python3 - <<'PY'
          import struct, zlib
          w = h = 192
          rows = []
          for y in range(h):
              row = bytearray([0])
              for x in range(w):
                  border = (20 <= x < 172 and 20 <= y < 172) and (x < 28 or x >= 164 or y < 28 or y >= 164)
                  if border:
                      row.extend((255, 69, 0, 255))
                  else:
                      row.extend((0, 0, 0, 255))
              rows.append(bytes(row))
          def chunk(t, d):
              return struct.pack(">I", len(d)) + t + d + struct.pack(">I", zlib.crc32(t + d) & 0xffffffff)
          png = b"\x89PNG\r\n\x1a\n"
          png += chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 6, 0, 0, 0))
          png += chunk(b"IDAT", zlib.compress(b"".join(rows), 9))
          png += chunk(b"IEND", b"")
          with open("build/res/mipmap-xxxhdpi/ic_launcher.png", "wb") as f:
              f.write(png)
          PY

          # Adaptive icon background
          cat <<'EOF' > build/res/drawable/ic_launcher_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#000000" />
          </shape>
          EOF

          # Adaptive icon foreground (industrial M + orange reticle)
          cat <<'EOF' > build/res/drawable/ic_launcher_fg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:pathData="M28,28 H80 V80 H28 Z"
                  android:strokeColor="#FF4500"
                  android:strokeWidth="3" />
              <path
                  android:pathData="M37,68 V40 L54,57 L71,40 V68"
                  android:strokeColor="#F2F2F2"
                  android:strokeWidth="5"
                  android:strokeLineCap="square"
                  android:strokeLineJoin="miter" />
              <path
                  android:pathData="M54,28 V21 M54,87 V80 M21,54 H28 M80,54 H87"
                  android:strokeColor="#FF4500"
                  android:strokeWidth="2.5" />
          </vector>
          EOF

          cat <<'EOF' > build/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_bg" />
              <foreground android:drawable="@drawable/ic_launcher_fg" />
          </adaptive-icon>
          EOF

          cat <<'EOF' > build/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.mendeleev.table3d"
              android:versionCode="1"
              android:versionName="1.0">

              <uses-sdk android:minSdkVersion="24" android:targetSdkVersion="34" />

              <application
                  android:label="Менделеев 3D"
                  android:icon="@mipmap/ic_launcher"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat <<'EOF' > build/src/com/mendeleev/table3d/MainActivity.java
          package com.mendeleev.table3d;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.ValueCallback;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  Window window = getWindow();
                  window.addFlags(WindowManager.LayoutParams.FLAG_DRAWS_SYSTEM_BAR_BACKGROUNDS);
                  window.setStatusBarColor(Color.BLACK);
                  window.setNavigationBarColor(Color.BLACK);

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.BLACK);
                  webView.setOverScrollMode(View.OVER_SCROLL_NEVER);
                  webView.setVerticalScrollBarEnabled(false);
                  webView.setHorizontalScrollBarEnabled(false);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setUseWideViewPort(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setAllowFileAccess(true);

                  webView.setWebViewClient(new WebViewClient());
                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  webView.evaluateJavascript(
                      "(function(){" +
                      "  var fs=document.getElementById('fsPortal');" +
                      "  if(fs && fs.classList.contains('open')){ document.getElementById('btnExpand').click(); return 'handled'; }" +
                      "  var dv=document.getElementById('detailView');" +
                      "  if(dv && dv.classList.contains('is-visible')){ document.getElementById('btnClose').click(); return 'handled'; }" +
                      "  return 'exit';" +
                      "})()",
                      new ValueCallback<String>() {
                          @Override
                          public void onReceiveValue(String val) {
                              if (!"\"handled\"".equals(val)) {
                                  MainActivity.super.onBackPressed();
                              }
                          }
                      }
                  );
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  if (webView != null) webView.onPause();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (webView != null) webView.onResume();
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) webView.destroy();
                  super.onDestroy();
              }
          }
          EOF

          # Compile resources and link APK with assets/index.html
          "$BUILD_TOOLS/aapt2" compile --dir build/res -o build/res.zip
          "$BUILD_TOOLS/aapt2" link \
            -I "$ANDROID_JAR" \
            --manifest build/AndroidManifest.xml \
            -A build/assets \
            -o build/unsigned.apk \
            build/res.zip

          # Compile Java -> DEX and inject into APK
          javac -source 8 -target 8 -cp "$ANDROID_JAR" -d build/classes \
            build/src/com/mendeleev/table3d/MainActivity.java
          "$BUILD_TOOLS/d8" --lib "$ANDROID_JAR" --min-api 24 --output build/dex \
            build/classes/com/mendeleev/table3d/*.class
          zip -j -u build/unsigned.apk build/dex/classes.dex

          # Align and sign APK
          "$BUILD_TOOLS/zipalign" -p -f 4 build/unsigned.apk build/aligned.apk
          keytool -genkeypair -keystore build/mendeleev.keystore \
            -storepass mendeleev123 -alias mendeleev -keypass mendeleev123 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Mendeleev3D, O=Mendeleev, C=RU"
          "$BUILD_TOOLS/apksigner" sign \
            --ks build/mendeleev.keystore \
            --ks-key-alias mendeleev \
            --ks-pass pass:mendeleev123 \
            --key-pass pass:mendeleev123 \
            --out Mendeleev-3D.apk \
            build/aligned.apk
          "$BUILD_TOOLS/apksigner" verify Mendeleev-3D.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Mendeleev-3D-Android-APK
          path: Mendeleev-3D.apk
