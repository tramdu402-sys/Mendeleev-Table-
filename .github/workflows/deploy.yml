name: Website, PC & Android

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "mendeleev-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  deploy-web:
    name: Website (GitHub Pages)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare site files
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-windows-app:
    name: PC App (Windows EXE · C++ WebView2)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build offline native Windows EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path build_win) { Remove-Item -Recurse -Force build_win }
          New-Item -ItemType Directory -Force -Path build_win | Out-Null

          Copy-Item index.html build_win\index.html

          # Download Three.js core files for 100% offline 3D
          $cdn = "https://cdn.jsdelivr.net/npm/three@0.187.0/build"
          curl.exe -fsSL --retry 3 "$cdn/three.module.js" -o build_win\three.module.js
          curl.exe -fsSL --retry 3 "$cdn/three.core.js" -o build_win\three.core.js

          # Download official Microsoft.Web.WebView2 SDK (header + static loader)
          curl.exe -fsSL --retry 3 "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2" -o build_win\wv2.zip
          Expand-Archive -Path build_win\wv2.zip -DestinationPath build_win\wv2 -Force

          @'
          import struct, zlib
          w = h = 256
          rows = []
          for y in range(h):
              row = bytearray([0])
              for x in range(w):
                  in_box = 24 <= x < 232 and 24 <= y < 232
                  border = in_box and (x < 34 or x >= 222 or y < 34 or y >= 222)
                  m_left = 74 <= x < 92 and 76 <= y < 182
                  m_right = 164 <= x < 182 and 76 <= y < 182
                  diag_l = 76 <= y < 142 and abs((x - 83) - (y - 76) * 0.72) < 9.5 and x <= 128
                  diag_r = 76 <= y < 142 and abs((173 - x) - (y - 76) * 0.72) < 9.5 and x >= 128
                  if m_left or m_right or diag_l or diag_r:
                      row.extend((252, 250, 255, 255))
                  elif border:
                      row.extend((234, 92, 42, 255))
                  else:
                      row.extend((0, 0, 0, 255))
              rows.append(bytes(row))
          def chunk(t, d):
              return struct.pack(">I", len(d)) + t + d + struct.pack(">I", zlib.crc32(t + d) & 0xffffffff)
          png = b"\x89PNG\r\n\x1a\n"
          png += chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 6, 0, 0, 0))
          png += chunk(b"IDAT", zlib.compress(b"".join(rows), 9))
          png += chunk(b"IEND", b"")
          ico = struct.pack("<HHH", 0, 1, 1)
          ico += struct.pack("<BBBBHHII", 0, 0, 0, 0, 1, 32, len(png), 22)
          ico += png
          with open("build_win/app.ico", "wb") as f:
              f.write(ico)
          '@ | Set-Content -Encoding UTF8 build_win\make_ico.py

          python build_win\make_ico.py

          @'
          1 ICON "app.ico"
          101 RCDATA "index.html"
          102 RCDATA "three.module.js"
          103 RCDATA "three.core.js"
          '@ | Set-Content -Encoding ASCII build_win\app.rc

          @'
          #include <windows.h>
          #include <dwmapi.h>
          #include <shlobj.h>
          #include <shlwapi.h>
          #include <objbase.h>
          #include <string>
          #include "WebView2.h"

          static HWND g_hwnd = nullptr;
          static ICoreWebView2Environment* g_env = nullptr;
          static ICoreWebView2Controller* g_controller = nullptr;
          static ICoreWebView2* g_webview = nullptr;

          template <typename Interface>
          class ComCallback : public Interface {
              LONG refCount_ = 1;
          public:
              virtual ~ComCallback() = default;
              HRESULT STDMETHODCALLTYPE QueryInterface(REFIID riid, void** ppv) override {
                  if (!ppv) return E_POINTER;
                  if (riid == IID_IUnknown || riid == __uuidof(Interface)) {
                      *ppv = static_cast<Interface*>(this);
                      AddRef();
                      return S_OK;
                  }
                  *ppv = nullptr;
                  return E_NOINTERFACE;
              }
              ULONG STDMETHODCALLTYPE AddRef() override {
                  return static_cast<ULONG>(InterlockedIncrement(&refCount_));
              }
              ULONG STDMETHODCALLTYPE Release() override {
                  ULONG c = static_cast<ULONG>(InterlockedDecrement(&refCount_));
                  if (c == 0) delete this;
                  return c;
              }
          };

          static IStream* LoadEmbeddedResource(int resId) {
              HMODULE mod = GetModuleHandleW(nullptr);
              HRSRC hRes = FindResourceW(mod, MAKEINTRESOURCEW(resId), RT_RCDATA);
              if (!hRes) return nullptr;
              HGLOBAL hData = LoadResource(mod, hRes);
              if (!hData) return nullptr;
              DWORD size = SizeofResource(mod, hRes);
              const BYTE* ptr = static_cast<const BYTE*>(LockResource(hData));
              if (!ptr || size == 0) return nullptr;
              return SHCreateMemStream(ptr, size);
          }

          class ResourceHandler : public ComCallback<ICoreWebView2WebResourceRequestedEventHandler> {
          public:
              HRESULT STDMETHODCALLTYPE Invoke(ICoreWebView2*, ICoreWebView2WebResourceRequestedEventArgs* args) override {
                  if (!g_env || !args) return S_OK;
                  ICoreWebView2WebResourceRequest* req = nullptr;
                  if (FAILED(args->get_Request(&req)) || !req) return S_OK;

                  LPWSTR uriRaw = nullptr;
                  if (SUCCEEDED(req->get_Uri(&uriRaw)) && uriRaw) {
                      std::wstring uri(uriRaw);
                      CoTaskMemFree(uriRaw);

                      int resId = 0;
                      const wchar_t* headers = L"";
                      int status = 200;
                      const wchar_t* reason = L"OK";

                      if (uri.find(L"https://mendeleev.local/") == 0) {
                          if (uri.find(L"favicon.ico") != std::wstring::npos) {
                              status = 204;
                              reason = L"No Content";
                          } else {
                              resId = 101;
                              headers = L"Content-Type: text/html; charset=utf-8\r\nAccess-Control-Allow-Origin: *\r\nCache-Control: no-cache";
                          }
                      } else if (uri.find(L"three.module.js") != std::wstring::npos) {
                          resId = 102;
                          headers = L"Content-Type: application/javascript; charset=utf-8\r\nAccess-Control-Allow-Origin: *";
                      } else if (uri.find(L"three.core.js") != std::wstring::npos) {
                          resId = 103;
                          headers = L"Content-Type: application/javascript; charset=utf-8\r\nAccess-Control-Allow-Origin: *";
                      }

                      if (status == 204 || resId != 0) {
                          IStream* stream = resId ? LoadEmbeddedResource(resId) : nullptr;
                          ICoreWebView2WebResourceResponse* resp = nullptr;
                          if (SUCCEEDED(g_env->CreateWebResourceResponse(stream, status, reason, headers, &resp)) && resp) {
                              args->put_Response(resp);
                              resp->Release();
                          }
                          if (stream) stream->Release();
                      }
                  }
                  req->Release();
                  return S_OK;
              }
          };

          class ControllerHandler : public ComCallback<ICoreWebView2CreateCoreWebView2ControllerCompletedHandler> {
          public:
              HRESULT STDMETHODCALLTYPE Invoke(HRESULT result, ICoreWebView2Controller* controller) override {
                  if (FAILED(result) || !controller) return S_OK;

                  g_controller = controller;
                  g_controller->AddRef();

                  ICoreWebView2Controller2* ctrl2 = nullptr;
                  if (SUCCEEDED(g_controller->QueryInterface(__uuidof(ICoreWebView2Controller2), reinterpret_cast<void**>(&ctrl2))) && ctrl2) {
                      COREWEBVIEW2_COLOR bg = { 255, 0, 0, 0 };
                      ctrl2->put_DefaultBackgroundColor(bg);
                      ctrl2->Release();
                  }

                  RECT bounds;
                  GetClientRect(g_hwnd, &bounds);
                  g_controller->put_Bounds(bounds);
                  g_controller->put_IsVisible(TRUE);

                  if (SUCCEEDED(g_controller->get_CoreWebView2(&g_webview)) && g_webview) {
                      ICoreWebView2Settings* settings = nullptr;
                      if (SUCCEEDED(g_webview->get_Settings(&settings)) && settings) {
                          settings->put_AreDefaultContextMenusEnabled(FALSE);
                          settings->put_AreDevToolsEnabled(FALSE);
                          settings->put_IsStatusBarEnabled(FALSE);
                          settings->put_IsZoomControlEnabled(FALSE);
                          settings->Release();
                      }

                      g_webview->AddWebResourceRequestedFilter(L"https://mendeleev.local/*", COREWEBVIEW2_WEB_RESOURCE_CONTEXT_ALL);
                      g_webview->AddWebResourceRequestedFilter(L"https://cdn.jsdelivr.net/npm/three@0.187.0/*", COREWEBVIEW2_WEB_RESOURCE_CONTEXT_ALL);

                      EventRegistrationToken token;
                      auto* resHandler = new ResourceHandler();
                      g_webview->add_WebResourceRequested(resHandler, &token);
                      resHandler->Release();

                      g_webview->Navigate(L"https://mendeleev.local/index.html");
                  }
                  return S_OK;
              }
          };

          class EnvironmentHandler : public ComCallback<ICoreWebView2CreateCoreWebView2EnvironmentCompletedHandler> {
          public:
              HRESULT STDMETHODCALLTYPE Invoke(HRESULT result, ICoreWebView2Environment* env) override {
                  if (FAILED(result) || !env) {
                      MessageBoxW(
                          g_hwnd,
                          L"Для запуска требуется Microsoft Edge WebView2 Runtime.\nСкачать можно с официального сайта Microsoft.",
                          L"Менделеев 3D",
                          MB_ICONERROR | MB_OK
                      );
                      PostQuitMessage(1);
                      return S_OK;
                  }
                  g_env = env;
                  g_env->AddRef();

                  auto* ctrlHandler = new ControllerHandler();
                  g_env->CreateCoreWebView2Controller(g_hwnd, ctrlHandler);
                  ctrlHandler->Release();
                  return S_OK;
              }
          };

          static LRESULT CALLBACK WndProc(HWND hwnd, UINT msg, WPARAM wParam, LPARAM lParam) {
              switch (msg) {
              case WM_SIZE:
                  if (g_controller) {
                      RECT bounds;
                      GetClientRect(hwnd, &bounds);
                      g_controller->put_Bounds(bounds);
                  }
                  return 0;
              case WM_GETMINMAXINFO: {
                  auto* mmi = reinterpret_cast<MINMAXINFO*>(lParam);
                  mmi->ptMinTrackSize.x = 760;
                  mmi->ptMinTrackSize.y = 540;
                  return 0;
              }
              case WM_DESTROY:
                  if (g_webview) { g_webview->Release(); g_webview = nullptr; }
                  if (g_controller) { g_controller->Close(); g_controller->Release(); g_controller = nullptr; }
                  if (g_env) { g_env->Release(); g_env = nullptr; }
                  PostQuitMessage(0);
                  return 0;
              }
              return DefWindowProcW(hwnd, msg, wParam, lParam);
          }

          int WINAPI wWinMain(HINSTANCE hInstance, HINSTANCE, PWSTR, int nCmdShow) {
              using SetDpiCtxFn = BOOL (WINAPI*)(HANDLE);
              if (auto fn = reinterpret_cast<SetDpiCtxFn>(GetProcAddress(GetModuleHandleW(L"user32.dll"), "SetProcessDpiAwarenessContext"))) {
                  fn(reinterpret_cast<HANDLE>(-4));
              } else {
                  SetProcessDPIAware();
              }

              CoInitializeEx(nullptr, COINIT_APARTMENTTHREADED);

              WNDCLASSEXW wc = {};
              wc.cbSize = sizeof(wc);
              wc.lpfnWndProc = WndProc;
              wc.hInstance = hInstance;
              wc.hIcon = LoadIconW(hInstance, MAKEINTRESOURCEW(1));
              wc.hIconSm = wc.hIcon;
              wc.hCursor = LoadCursorW(nullptr, IDC_ARROW);
              wc.hbrBackground = static_cast<HBRUSH>(GetStockObject(BLACK_BRUSH));
              wc.lpszClassName = L"Mendeleev3DWindow";
              RegisterClassExW(&wc);

              g_hwnd = CreateWindowExW(
                  0, wc.lpszClassName, L"МЕНДЕЛЕЕВ // 3D · 118",
                  WS_OVERLAPPEDWINDOW,
                  CW_USEDEFAULT, CW_USEDEFAULT, 1280, 820,
                  nullptr, nullptr, hInstance, nullptr
              );

              BOOL dark = TRUE;
              DwmSetWindowAttribute(g_hwnd, 20, &dark, sizeof(dark));
              DwmSetWindowAttribute(g_hwnd, 19, &dark, sizeof(dark));

              ShowWindow(g_hwnd, nCmdShow);
              UpdateWindow(g_hwnd);

              WCHAR appData[MAX_PATH] = {};
              SHGetFolderPathW(nullptr, CSIDL_LOCAL_APPDATA, nullptr, 0, appData);
              std::wstring userDataDir = std::wstring(appData) + L"\\Mendeleev3D\\WebView2";

              auto* envHandler = new EnvironmentHandler();
              CreateCoreWebView2EnvironmentWithOptions(nullptr, userDataDir.c_str(), nullptr, envHandler);
              envHandler->Release();

              MSG msg;
              while (GetMessageW(&msg, nullptr, 0, 0)) {
                  TranslateMessage(&msg);
                  DispatchMessageW(&msg);
              }

              CoUninitialize();
              return static_cast<int>(msg.wParam);
          }
          '@ | Set-Content -Encoding UTF8 build_win\main.cpp

          rc /nologo build_win\app.rc
          cl /nologo /O2 /MT /EHsc /utf-8 /DUNICODE /D_UNICODE `
            /Ibuild_win\wv2\build\native\include `
            build_win\main.cpp build_win\app.res `
            /Fe:Mendeleev-3D.exe `
            /link /SUBSYSTEM:WINDOWS `
            build_win\wv2\build\native\x64\WebView2LoaderStatic.lib `
            user32.lib gdi32.lib ole32.lib oleaut32.lib shell32.lib shlwapi.lib advapi32.lib version.lib dwmapi.lib

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Mendeleev-Windows-x64
          path: Mendeleev-3D.exe

  build-android-apk:
    name: Phone & Tablet App (Android APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build offline Android APK
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          PLATFORM_DIR=$(ls -d "$SDK"/platforms/android-[0-9]* | sort -V | tail -n 1)
          ANDROID_JAR="$PLATFORM_DIR/android.jar"
          BUILD_TOOLS=$(find "$SDK/build-tools" -maxdepth 1 -mindepth 1 -type d | grep -v 'rc' | sort -V | tail -n 1)

          rm -rf build
          mkdir -p build/assets/three/build \
                   build/res/drawable \
                   build/res/mipmap-anydpi-v26 \
                   build/res/mipmap-xxxhdpi \
                   build/src/com/mendeleev/table3d \
                   build/classes \
                   build/dex

          cp index.html build/assets/index.html

          # Download only the 2 required Three.js core files for offline 3D
          CDN="https://cdn.jsdelivr.net/npm/three@0.187.0"
          curl -fsSL --retry 3 "$CDN/build/three.module.js" -o build/assets/three/build/three.module.js
          curl -fsSL --retry 3 "$CDN/build/three.core.js" -o build/assets/three/build/three.core.js

          # Fallback PNG icon
          python3 - <<'PY'
          import struct, zlib
          w = h = 192
          rows = []
          for y in range(h):
              row = bytearray([0])
              for x in range(w):
                  border = (20 <= x < 172 and 20 <= y < 172) and (x < 28 or x >= 164 or y < 28 or y >= 164)
                  row.extend((234, 92, 42, 255) if border else (0, 0, 0, 255))
              rows.append(bytes(row))
          def chunk(t, d):
              return struct.pack(">I", len(d)) + t + d + struct.pack(">I", zlib.crc32(t + d) & 0xffffffff)
          png = b"\x89PNG\r\n\x1a\n"
          png += chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 6, 0, 0, 0))
          png += chunk(b"IDAT", zlib.compress(b"".join(rows), 9))
          png += chunk(b"IEND", b"")
          with open("build/res/mipmap-xxxhdpi/ic_launcher.png", "wb") as f:
              f.write(png)
          PY

          cat <<'EOF' > build/res/drawable/ic_launcher_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#000000" />
          </shape>
          EOF

          cat <<'EOF' > build/res/drawable/ic_launcher_fg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:pathData="M28,28 H80 V80 H28 Z"
                  android:strokeColor="#EA5C2A"
                  android:strokeWidth="3" />
              <path
                  android:pathData="M37,68 V40 L54,57 L71,40 V68"
                  android:strokeColor="#FCFAFF"
                  android:strokeWidth="5"
                  android:strokeLineCap="square"
                  android:strokeLineJoin="miter" />
              <path
                  android:pathData="M54,28 V21 M54,87 V80 M21,54 H28 M80,54 H87"
                  android:strokeColor="#EA5C2A"
                  android:strokeWidth="2.5" />
          </vector>
          EOF

          cat <<'EOF' > build/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_bg" />
              <foreground android:drawable="@drawable/ic_launcher_fg" />
          </adaptive-icon>
          EOF

          cat <<'EOF' > build/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.mendeleev.table3d"
              android:versionCode="4"
              android:versionName="4.0">

              <uses-sdk android:minSdkVersion="24" android:targetSdkVersion="34" />

              <application
                  android:label="Менделеев 3D"
                  android:icon="@mipmap/ic_launcher"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustNothing"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat <<'EOF' > build/src/com/mendeleev/table3d/MainActivity.java
          package com.mendeleev.table3d;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.HapticFeedbackConstants;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowInsetsController;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import java.io.ByteArrayInputStream;
          import java.io.InputStream;
          import java.util.HashMap;
          import java.util.Map;

          public class MainActivity extends Activity {
              private WebView webView;
              private static final String APP_ORIGIN = "https://mendeleev.local/";
              private static final String THREE_CDN = "https://cdn.jsdelivr.net/npm/three@0.187.0/";

              private class AppBridge {
                  @JavascriptInterface
                  public void tick() {
                      if (webView != null) {
                          webView.post(new Runnable() {
                              @Override
                              public void run() {
                                  webView.performHapticFeedback(
                                      HapticFeedbackConstants.CLOCK_TICK,
                                      HapticFeedbackConstants.FLAG_IGNORE_GLOBAL_SETTING
                                  );
                              }
                          });
                      }
                  }

                  @JavascriptInterface
                  public void setTheme(final String theme) {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              boolean light = "light".equals(theme);
                              int bg = light ? Color.parseColor("#FCFAFF") : Color.BLACK;
                              Window w = getWindow();
                              w.setStatusBarColor(bg);
                              w.setNavigationBarColor(bg);
                              if (webView != null) webView.setBackgroundColor(bg);
                              if (Build.VERSION.SDK_INT >= 30) {
                                  WindowInsetsController ctrl = w.getInsetsController();
                                  if (ctrl != null) {
                                      int mask = WindowInsetsController.APPEARANCE_LIGHT_STATUS_BARS
                                               | WindowInsetsController.APPEARANCE_LIGHT_NAVIGATION_BARS;
                                      ctrl.setSystemBarsAppearance(light ? mask : 0, mask);
                                  }
                              } else {
                                  View decor = w.getDecorView();
                                  int flags = decor.getSystemUiVisibility();
                                  int lightFlags = View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR | 0x00000010;
                                  decor.setSystemUiVisibility(light ? (flags | lightFlags) : (flags & ~lightFlags));
                              }
                          }
                      });
                  }
              }

              private WebResourceResponse assetResponse(String assetPath, String mime) {
                  try {
                      InputStream is = getAssets().open(assetPath);
                      Map<String, String> headers = new HashMap<>();
                      headers.put("Access-Control-Allow-Origin", "*");
                      headers.put("Cache-Control", "no-cache");
                      return new WebResourceResponse(mime, "UTF-8", 200, "OK", headers, is);
                  } catch (Exception e) {
                      return null;
                  }
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  Window window = getWindow();
                  window.addFlags(WindowManager.LayoutParams.FLAG_DRAWS_SYSTEM_BAR_BACKGROUNDS);
                  window.setStatusBarColor(Color.BLACK);
                  window.setNavigationBarColor(Color.BLACK);

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.BLACK);
                  webView.setOverScrollMode(View.OVER_SCROLL_NEVER);
                  webView.setVerticalScrollBarEnabled(false);
                  webView.setHorizontalScrollBarEnabled(false);
                  webView.setHapticFeedbackEnabled(true);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setUseWideViewPort(true);
                  settings.setLoadWithOverviewMode(true);

                  webView.addJavascriptInterface(new AppBridge(), "AndroidHaptics");

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          if (url.startsWith(APP_ORIGIN)) {
                              if (url.endsWith("favicon.ico")) {
                                  return new WebResourceResponse("image/x-icon", "UTF-8", 204, "No Content", null, new ByteArrayInputStream(new byte[0]));
                              }
                              return assetResponse("index.html", "text/html");
                          }
                          if (url.startsWith(THREE_CDN)) {
                              String subPath = url.substring(THREE_CDN.length());
                              int q = subPath.indexOf('?');
                              if (q >= 0) subPath = subPath.substring(0, q);
                              return assetResponse("three/" + subPath, "application/javascript");
                          }
                          return super.shouldInterceptRequest(view, request);
                      }
                  });

                  setContentView(webView);
                  webView.loadUrl(APP_ORIGIN + "index.html");
              }

              @Override
              public void onBackPressed() {
                  webView.evaluateJavascript(
                      "(function(){" +
                      "  var sm=document.getElementById('settingsModal');" +
                      "  if(sm && sm.classList.contains('open')){ document.getElementById('settingsClose').click(); return 'handled'; }" +
                      "  var fs=document.getElementById('fsPortal');" +
                      "  if(fs && fs.classList.contains('open')){ document.getElementById('btnExpand').click(); return 'handled'; }" +
                      "  var dv=document.getElementById('detailView');" +
                      "  if(dv && dv.classList.contains('is-visible')){ document.getElementById('btnClose').click(); return 'handled'; }" +
                      "  return 'exit';" +
                      "})()",
                      new ValueCallback<String>() {
                          @Override
                          public void onReceiveValue(String val) {
                              if (!"\"handled\"".equals(val)) {
                                  MainActivity.super.onBackPressed();
                              }
                          }
                      }
                  );
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  if (webView != null) webView.onPause();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (webView != null) webView.onResume();
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) webView.destroy();
                  super.onDestroy();
              }
          }
          EOF

          "$BUILD_TOOLS/aapt2" compile --dir build/res -o build/res.zip
          "$BUILD_TOOLS/aapt2" link \
            -I "$ANDROID_JAR" \
            --manifest build/AndroidManifest.xml \
            -A build/assets \
            -o build/unsigned.apk \
            build/res.zip

          javac -source 8 -target 8 -cp "$ANDROID_JAR" -d build/classes \
            build/src/com/mendeleev/table3d/MainActivity.java
          "$BUILD_TOOLS/d8" --lib "$ANDROID_JAR" --min-api 24 --output build/dex \
            build/classes/com/mendeleev/table3d/*.class
          zip -j -u build/unsigned.apk build/dex/classes.dex

          "$BUILD_TOOLS/zipalign" -p -f 4 build/unsigned.apk build/aligned.apk
          keytool -genkeypair -keystore build/mendeleev.keystore \
            -storepass mendeleev123 -alias mendeleev -keypass mendeleev123 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Mendeleev3D, O=Mendeleev, C=RU"
          "$BUILD_TOOLS/apksigner" sign \
            --ks build/mendeleev.keystore \
            --ks-key-alias mendeleev \
            --ks-pass pass:mendeleev123 \
            --key-pass pass:mendeleev123 \
            --out Mendeleev-3D.apk \
            build/aligned.apk
          "$BUILD_TOOLS/apksigner" verify Mendeleev-3D.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Mendeleev-3D-Android-APK
          path: Mendeleev-3D.apk
