<!DOCTYPE html>
<html lang="ru" data-theme="dark" data-layout="short">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" id="metaTheme" content="#000000" />
  <title>Таблица Менделеева</title>
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <header class="topbar" id="topbar">
    <div class="brand">
      <span class="brand-title" id="brandTitle">Таблица Менделеева</span>
    </div>

    <div class="search-box" id="searchBox">
      <input id="searchInput" class="search" type="text" placeholder="Au, Золото, 79" autocomplete="off" spellcheck="false" />
      <button id="clearSearch" class="btn-icon-sm" type="button" aria-label="Закрыть поиск">✕</button>
    </div>

    <div class="controls">
      <button id="searchToggle" class="btn-icon" type="button" aria-label="Поиск">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"/>
          <path d="m20 20-3.5-3.5"/>
        </svg>
      </button>
      <button id="settingsBtn" class="btn-icon btn-gear" type="button" aria-label="Настройки">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3.2"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.08a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.08a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.08a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
  </header>

  <section class="hero" id="hero">
    <div class="hero-inner">
      <div class="hero-portrait-wrap">
        <img class="hero-portrait" src="file_000000001ec481f4a837f226b519b52e.png" alt="Д. И. Менделеев" decoding="async" />
      </div>
      <div class="hero-copy">
        <div class="hero-kicker" id="heroKicker">1869 · 118 ЭЛЕМЕНТОВ</div>
        <h1 class="hero-title" id="heroTitle">Д. И. МЕНДЕЛЕЕВ</h1>
      </div>
    </div>
  </section>

  <main class="main-wrap" id="tableAnchor">
    <section class="table-section" id="tableSection">
      <div class="ptable-short" id="ptableShort">
        <div class="short-grid" id="shortGrid"></div>
        <div class="oxide-block">
          <div class="oxide-caption" id="oxideCaption">ВЫСШИЕ ОКСИДЫ</div>
          <div class="oxide-row" id="oxideRow"></div>
        </div>
        <div class="f-series" id="shortFSeries">
          <div class="f-row" id="shortLaRow"></div>
          <div class="f-row" id="shortAcRow"></div>
        </div>
      </div>

      <div class="ptable-long" id="ptableLong"></div>
    </section>

    <p class="select-prompt" id="selectPrompt">Нажми на элемент или зажми на 0.15с и веди пальцем</p>

    <section class="detail-section" id="detailSection" aria-hidden="true">
      <div class="detail-card">
        <div class="detail-head">
          <div class="detail-badge">
            <span class="detail-z" id="fZ">+1</span>
            <span class="detail-sym" id="fSym">H</span>
          </div>
          <div class="detail-titles">
            <div class="detail-title-row">
              <span class="detail-primary" id="fPrimary">Водород</span>
              <span class="detail-secondary" id="fSecondary">Hydrogen</span>
            </div>
            <div class="detail-tags">
              <span class="tag-pill is-acc2" id="fPos">1 пер · IА</span>
              <span class="tag-pill" id="fMass">Ar 1.008</span>
              <button type="button" class="tag-pill tag-cat" id="fCat">Неметалл</button>
            </div>
          </div>
          <div class="detail-nav">
            <button type="button" class="nav-btn" id="btnPrev" aria-label="Предыдущий">←</button>
            <button type="button" class="nav-btn" id="btnNext" aria-label="Следующий">→</button>
            <button type="button" class="nav-btn" id="btnClose" aria-label="Закрыть">✕</button>
          </div>
        </div>

        <div class="stage-3d-slot" id="stage3dSlot">
          <div class="stage-3d" id="stage3d">
            <canvas id="canvas3d"></canvas>
            <div class="webgl-err" id="webglErr">WebGL недоступен</div>
            <div class="hud-3d-top">
              <span class="hud-3d-label" id="hud3dLabel">3D · АТОМ</span>
              <div class="hud-3d-modes">
                <button type="button" class="mode-btn active" data-mode="atom" id="modeAtom">АТОМ</button>
                <button type="button" class="mode-btn" data-mode="lattice" id="modeLattice">КРИСТАЛЛ</button>
                <button type="button" class="mode-btn" data-mode="specimen" id="modeSpecimen">ОБРАЗЕЦ</button>
                <button type="button" class="mode-btn" id="btnExpand" title="На весь экран">⤢</button>
              </div>
            </div>
            <div class="hud-3d-bottom">
              <span class="hud-pill hud-shells" id="hudShells">e⁻: <b>1</b></span>
              <span class="hud-pill hud-cfg" id="hudCfg">1s¹</span>
            </div>
          </div>
        </div>

        <div class="detail-info">
          <div class="info-block">
            <div class="info-lbl" id="lblDesc">ОПИСАНИЕ</div>
            <div class="info-txt" id="fDesc"></div>
          </div>
          <div class="info-block fact">
            <div class="info-lbl" id="lblFeat">СВОЙСТВО И ФАКТ</div>
            <div class="info-txt" id="fFeat"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="settings-backdrop" id="settingsModal" aria-hidden="true">
    <div class="settings-card" role="dialog" aria-modal="true">
      <div class="settings-head">
        <span class="settings-title" id="setTitle">НАСТРОЙКИ</span>
        <button type="button" class="settings-close" id="settingsClose" aria-label="Закрыть">✕</button>
      </div>

      <div class="setting-row">
        <div class="setting-info">
          <span class="setting-lbl" id="setLangLbl">ЯЗЫК</span>
          <span class="setting-sub" id="setLangVal">Русский</span>
        </div>
        <div class="swatch-group">
          <button type="button" class="swatch-btn active" data-lang="ru" aria-label="Русский">
            <svg viewBox="0 0 36 36"><rect width="36" height="12" y="0" fill="#FFFFFF"/><rect width="36" height="12" y="12" fill="#0039A6"/><rect width="36" height="12" y="24" fill="#D52B1E"/></svg>
          </button>
          <button type="button" class="swatch-btn" data-lang="en" aria-label="English">
            <svg viewBox="0 0 60 60"><rect width="60" height="60" fill="#012169"/><path d="M0,0 L60,60 M60,0 L0,60" stroke="#FFFFFF" stroke-width="11"/><path d="M0,0 L60,60 M60,0 L0,60" stroke="#C8102E" stroke-width="4.5"/><path d="M30,0 V60 M0,30 H60" stroke="#FFFFFF" stroke-width="15"/><path d="M30,0 V60 M0,30 H60" stroke="#C8102E" stroke-width="8.5"/></svg>
          </button>
        </div>
      </div>

      <div class="setting-row">
        <div class="setting-info">
          <span class="setting-lbl" id="setThemeLbl">ТЕМА</span>
          <span class="setting-sub" id="setThemeVal">Тёмная</span>
        </div>
        <div class="swatch-group">
          <button type="button" class="swatch-btn theme-dark active" data-theme-pick="dark" aria-label="Тёмная"></button>
          <button type="button" class="swatch-btn theme-light" data-theme-pick="light" aria-label="Светлая"></button>
        </div>
      </div>

      <div class="setting-row">
        <div class="setting-info">
          <span class="setting-lbl" id="setLayoutLbl">ТАБЛИЦА</span>
          <span class="setting-sub" id="setLayoutVal">Короткая (8 групп)</span>
        </div>
        <div class="seg-group">
          <button type="button" class="seg-btn active" data-layout-pick="short" id="btnLayoutShort">Короткая</button>
          <button type="button" class="seg-btn" data-layout-pick="long" id="btnLayoutLong">Длинная</button>
        </div>
      </div>
    </div>
  </div>

  <div class="fs-portal" id="fsPortal"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
