<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>МЕНДЕЛЕЕВ // 118</title>
  <style>
    :root {
      --bg: #000000;
      --surface: #070707;
      --surface-2: #0f0f0f;
      --line: #222222;
      --line-strong: #383838;
      --accent: #FF4500;
      --accent-dim: #7a2200;
      --text: #F2F2F2;
      --muted: #7A7A7A;
      --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Consolas", monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      user-select: none;
      -webkit-user-select: none;
    }

    .app {
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      overflow: hidden;
    }

    /* ===== TOP BAR ===== */
    .topbar {
      flex: 0 0 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 10px;
      border-bottom: 1px solid var(--line);
      background: var(--bg);
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 6px;
      white-space: nowrap;
      font-family: var(--mono);
      letter-spacing: 0.08em;
    }

    .brand-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
    }

    .brand-tag {
      font-size: 10px;
      color: var(--accent);
      font-weight: 700;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      max-width: 280px;
      justify-content: flex-end;
    }

    .search-wrap {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
    }

    .search {
      width: 100%;
      height: 26px;
      background: var(--surface);
      border: 1px solid var(--line-strong);
      color: var(--text);
      font-family: var(--mono);
      font-size: 11px;
      padding: 0 24px 0 8px;
      outline: none;
      border-radius: 0;
      appearance: none;
    }

    .search::placeholder {
      color: var(--muted);
    }

    .search:focus {
      border-color: var(--accent);
    }

    .btn-clear {
      position: absolute;
      right: 0;
      top: 0;
      width: 24px;
      height: 26px;
      background: transparent;
      border: none;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 12px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .btn-clear.visible {
      display: flex;
    }

    .btn-clear:hover {
      color: var(--accent);
    }

    .btn-icon {
      height: 26px;
      padding: 0 8px;
      background: var(--surface);
      border: 1px solid var(--line-strong);
      color: var(--text);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.05em;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-icon:hover, .btn-icon.active {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ===== MAIN WORKSPACE ===== */
    .workspace {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ===== PERIODIC GRID ===== */
    .grid-stage {
      position: relative;
      flex: 0 0 40dvh;
      min-height: 205px;
      max-height: 360px;
      padding: 6px 4px;
      display: flex;
      align-items: stretch;
      justify-content: center;
      touch-action: none;
      overflow: hidden;
    }

    .ptable {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(18, minmax(0, 1fr));
      grid-template-rows: repeat(7, minmax(0, 1fr)) 5px repeat(2, minmax(0, 1fr));
      gap: 1px;
      background: var(--bg);
    }

    .cell {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
      min-width: 0;
      min-height: 0;
      transition: background-color 0.08s linear, border-color 0.08s linear;
    }

    /* Subtle category structural markers (strict monochrome + orange) */
    .cell::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: transparent;
    }

    .cell[data-cat="Щелочной металл"]::before { background: var(--accent); opacity: 0.9; }
    .cell[data-cat="Щёлочноземельный металл"]::before { background: var(--accent); opacity: 0.55; }
    .cell[data-cat="Галоген"]::before { background: #ffffff; opacity: 0.7; }
    .cell[data-cat="Благородный газ"] { background: #0c0c0c; border-color: #2c2c2c; }
    .cell[data-cat="Неметалл"]::before { background: #a8a8a8; opacity: 0.5; }
    .cell[data-cat="Полуметалл"]::before { background: #666666; opacity: 0.7; }
    .cell[data-cat="Лантаноид"], .cell[data-cat="Актиноид"] { background: #050505; border-color: #1c1c1c; }

    .cell-num {
      display: none;
      font-family: var(--mono);
      font-size: 9px;
      line-height: 1;
      color: var(--accent);
    }

    .cell-sym {
      font-family: var(--sans);
      font-size: clamp(8px, 2.35vw, 11px);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.04em;
      color: var(--text);
    }

    .cell-ru {
      display: none;
      font-size: 8px;
      line-height: 1.05;
      color: #a0a0a0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    .cell-mass {
      display: none;
      font-family: var(--mono);
      font-size: 8px;
      color: var(--muted);
    }

    .cell:hover {
      border-color: var(--accent);
      background: #140802;
      z-index: 2;
    }

    .cell.cat-match {
      border-color: var(--accent);
      background: #1a0900;
    }

    .cell.dimmed {
      opacity: 0.2;
    }

    .cell.active {
      background: var(--accent) !important;
      border-color: var(--accent) !important;
      z-index: 4;
      opacity: 1 !important;
    }

    .cell.active .cell-sym,
    .cell.active .cell-num,
    .cell.active .cell-ru,
    .cell.active .cell-mass {
      color: #000000 !important;
    }

    .cell-marker {
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px dashed #262626;
      background: #030303;
      color: var(--accent);
      font-family: var(--mono);
      font-size: clamp(6px, 1.5vw, 9px);
      letter-spacing: -0.04em;
      pointer-events: none;
    }

    /* Mobile scrub HUD inside grid empty space */
    .scrub-hud {
      grid-column: 3 / 13;
      grid-row: 1 / 4;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 4px 8px;
      border: 1px solid #161616;
      background: #030303;
      pointer-events: none;
      overflow: hidden;
    }

    .scrub-kicker {
      font-family: var(--mono);
      font-size: 8px;
      color: var(--accent);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .scrub-main {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      margin-top: 2px;
    }

    .scrub-sub {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--muted);
      margin-top: 2px;
      white-space: nowrap;
    }

    /* Desktop embedded inspector is hidden inside grid on mobile */
    .desktop-center {
      display: none;
    }

    /* ===== BOTTOM INSPECTOR (MOBILE DEFAULT) ===== */
    .inspector {
      flex: 1;
      min-height: 0;
      border-top: 1px solid var(--accent);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 10px 12px;
    }

    /* Portrait view (idle state) */
    .portrait-view {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: minmax(120px, 46%) 1fr;
      gap: 12px;
      align-items: center;
      overflow: hidden;
    }

    .portrait-frame {
      position: relative;
      width: 100%;
      height: 100%;
      max-height: 100%;
      border: 1px solid var(--line-strong);
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 4px;
    }

    .portrait-frame::before,
    .portrait-frame::after {
      content: "";
      position: absolute;
      width: 8px;
      height: 8px;
      border-color: var(--accent);
      border-style: solid;
      pointer-events: none;
    }

    .portrait-frame::before {
      top: -1px;
      left: -1px;
      border-width: 2px 0 0 2px;
    }

    .portrait-frame::after {
      bottom: -1px;
      right: -1px;
      border-width: 0 2px 2px 0;
    }

    .portrait-svg {
      width: 100%;
      height: 100%;
      max-width: 220px;
      max-height: 100%;
      display: block;
    }

    .portrait-meta {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
      min-width: 0;
    }

    .meta-index {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--accent);
      letter-spacing: 0.14em;
    }

    .meta-name {
      font-size: clamp(16px, 4.8vw, 24px);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.02em;
      text-transform: uppercase;
    }

    .meta-years {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      border-left: 2px solid var(--accent);
      padding-left: 8px;
    }

    .meta-hint {
      font-size: 12px;
      line-height: 1.35;
      color: #bdbdbd;
    }

    .meta-stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 4px;
      margin-top: 2px;
    }

    .stat-box {
      border: 1px solid var(--line);
      background: var(--surface);
      padding: 5px 6px;
    }

    .stat-val {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }

    .stat-lbl {
      font-family: var(--mono);
      font-size: 8px;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* Element detail view */
    .detail-view {
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      gap: 8px;
      overflow: hidden;
    }

    .detail-view.visible {
      display: flex;
    }

    .portrait-view.hidden {
      display: none;
    }

    .detail-head {
      display: flex;
      align-items: stretch;
      gap: 10px;
      flex: 0 0 auto;
    }

    .detail-badge {
      width: 58px;
      height: 58px;
      flex: 0 0 58px;
      background: var(--accent);
      color: #000000;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 4px 6px;
    }

    .detail-num {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 800;
      line-height: 1;
    }

    .detail-sym {
      font-size: 28px;
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: -0.03em;
    }

    .detail-titles {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .detail-title-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
      flex-wrap: wrap;
    }

    .detail-ru {
      font-size: clamp(18px, 5vw, 24px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .detail-en {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
    }

    .detail-tags {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tag-pill {
      font-family: var(--mono);
      font-size: 10px;
      padding: 2px 6px;
      border: 1px solid var(--line-strong);
      background: var(--surface);
      color: var(--text);
      white-space: nowrap;
    }

    .tag-cat {
      cursor: pointer;
      border-color: var(--accent-dim);
      color: var(--accent);
    }

    .tag-cat.active {
      background: var(--accent);
      color: #000000;
      border-color: var(--accent);
      font-weight: 700;
    }

    .detail-nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 0 0 auto;
    }

    .nav-row {
      display: flex;
      gap: 4px;
    }

    .nav-btn {
      width: 28px;
      height: 27px;
      background: var(--surface);
      border: 1px solid var(--line-strong);
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .nav-btn-close {
      width: 100%;
      height: 27px;
      font-size: 10px;
      letter-spacing: 0.06em;
    }

    .detail-grid {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-rows: 1fr 1fr;
      gap: 8px;
    }

    .info-block {
      border: 1px solid var(--line);
      background: var(--surface);
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      min-height: 0;
      overflow: hidden;
    }

    .info-block.fact {
      border-left: 2px solid var(--accent);
    }

    .info-lbl {
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--accent);
      text-transform: uppercase;
    }

    .info-txt {
      font-size: clamp(11.5px, 3.2vw, 13.5px);
      line-height: 1.35;
      color: #e4e4e4;
      user-select: text;
      -webkit-user-select: text;
    }

    /* ===== DESKTOP LAYOUT (ZERO SCROLL, INSPECTOR EMBEDDED IN CENTER GAP) ===== */
    @media (min-width: 900px) and (min-height: 540px) {
      .topbar {
        flex: 0 0 42px;
        padding: 0 16px;
      }

      .brand-title {
        font-size: 13px;
      }

      .grid-stage {
        flex: 1;
        min-height: 0;
        max-height: none;
        padding: 10px 14px 12px;
      }

      .ptable {
        gap: 3px;
        grid-template-rows: repeat(7, minmax(0, 1fr)) 10px repeat(2, minmax(0, 1fr));
      }

      .cell {
        align-items: flex-start;
        justify-content: space-between;
        padding: 4px 5px;
      }

      .cell-top {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 2px;
      }

      .cell-num {
        display: block;
        font-size: clamp(8px, 0.72vw, 11px);
      }

      .cell-mass {
        display: block;
        font-size: clamp(7px, 0.58vw, 9px);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .cell-sym {
        font-size: clamp(13px, 1.35vw, 22px);
        letter-spacing: -0.02em;
      }

      .cell-ru {
        display: block;
        font-size: clamp(7px, 0.62vw, 10px);
      }

      .scrub-hud {
        display: none;
      }

      .inspector {
        display: none;
      }

      .desktop-center {
        grid-column: 3 / 13;
        grid-row: 1 / 4;
        display: flex;
        border: 1px solid var(--line-strong);
        border-left: 2px solid var(--accent);
        background: #040404;
        padding: 10px 14px;
        overflow: hidden;
        min-width: 0;
        min-height: 0;
      }

      .desktop-center .portrait-view {
        grid-template-columns: 160px 1fr;
        gap: 16px;
      }

      .desktop-center .portrait-frame {
        border-color: var(--line);
      }

      .desktop-center .meta-name {
        font-size: clamp(18px, 1.8vw, 26px);
      }

      .desktop-center .meta-hint {
        font-size: 12px;
      }

      .desktop-center .meta-stats {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        max-width: 340px;
      }

      .desktop-center .detail-grid {
        grid-template-rows: none;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .desktop-center .detail-badge {
        width: 52px;
        height: 52px;
        flex: 0 0 52px;
      }

      .desktop-center .detail-sym {
        font-size: 24px;
      }

      .desktop-center .detail-ru {
        font-size: clamp(16px, 1.5vw, 22px);
      }

      .desktop-center .info-txt {
        font-size: clamp(11px, 0.92vw, 13px);
        line-height: 1.32;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-title">МЕНДЕЛЕЕВ</span>
        <span class="brand-tag">// 118</span>
      </div>
      <div class="controls">
        <div class="search-wrap">
          <input id="searchInput" class="search" type="text" placeholder="Поиск: Au, Золото, 79" autocomplete="off" spellcheck="false" />
          <button id="clearSearch" class="btn-clear" type="button" aria-label="Очистить">✕</button>
        </div>
        <button id="resetBtn" class="btn-icon" type="button">ПОРТРЕТ</button>
      </div>
    </header>

    <main class="workspace">
      <section class="grid-stage" id="gridStage">
        <div class="ptable" id="ptable">
          <div class="scrub-hud" id="scrubHud">
            <span class="scrub-kicker">ПЕРИОДИЧЕСКАЯ СИСТЕМА</span>
            <span class="scrub-main" id="hudMain">ВЕДИ ПАЛЬЦЕМ ПО СЕТКЕ</span>
            <span class="scrub-sub" id="hudSub">18 ГРУПП · 7 ПЕРИОДОВ</span>
          </div>

          <div class="desktop-center" id="desktopCenter"></div>
        </div>
      </section>

      <section class="inspector" id="mobileInspector"></section>
    </main>
  </div>

  <!-- Template for inspector (mounted either in desktopCenter or mobileInspector) -->
  <template id="inspectorTpl">
    <div class="portrait-view" data-role="portraitView">
      <div class="portrait-frame">
        <!-- Multi-line architectural orange engraving of D. I. Mendeleev -->
        <svg class="portrait-svg" viewBox="0 0 260 280" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Д. И. Менделеев">
          <!-- Subtle technical grid ticks -->
          <g stroke="#FF4500" stroke-width="0.5" opacity="0.22">
            <line x1="8" y1="14" x2="252" y2="14" stroke-dasharray="2 6"/>
            <line x1="8" y1="268" x2="252" y2="268" stroke-dasharray="2 6"/>
            <line x1="130" y1="4" x2="130" y2="20"/>
            <line x1="12" y1="108" x2="22" y2="108"/>
            <line x1="238" y1="108" x2="248" y2="108"/>
          </g>

          <!-- Coat / Shoulders outer silhouette & structural folds -->
          <g stroke="#FF4500" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 274 C12 222 18 194 42 180 C62 169 80 165 92 162" stroke-width="1.5" opacity="0.85"/>
            <path d="M250 274 C248 220 242 192 218 180 C198 169 180 165 168 162" stroke-width="1.5" opacity="0.85"/>
            <!-- Left lapel & jacket collar -->
            <path d="M74 166 L60 194 L78 206 L68 214 L106 274" stroke-width="1.4" opacity="0.9"/>
            <path d="M84 176 L116 266" stroke-width="1.1" opacity="0.65"/>
            <!-- Right lapel -->
            <path d="M186 166 L202 194 L182 208 L192 216 L154 274" stroke-width="1.4" opacity="0.9"/>
            <path d="M176 176 L144 266" stroke-width="1.1" opacity="0.65"/>
            <!-- White shirt V-neck & waistcoat -->
            <path d="M116 206 L132 252 L148 212" stroke-width="1.1" opacity="0.75"/>
            <path d="M126 206 L136 244" stroke-width="0.7" opacity="0.5"/>
            <circle cx="131" cy="222" r="1.4" stroke-width="0.9" opacity="0.7"/>
            <circle cx="148" cy="256" r="2.2" stroke-width="1" opacity="0.8"/>
            <!-- Coat wool hatching -->
            <path d="M24 206 L58 272 M36 196 L74 272 M18 228 L42 272 M48 186 L90 272" stroke-width="0.6" opacity="0.28"/>
            <path d="M236 206 L202 272 M224 196 L186 272 M242 228 L218 272 M212 186 L170 272" stroke-width="0.6" opacity="0.28"/>
            <path d="M14 252 L28 274 M246 252 L232 274" stroke-width="0.6" opacity="0.25"/>
          </g>

          <!-- Flowing long hair (left & right swept strands) -->

  <script>
    const RAW_ELEMENTS = [
      [1,"H","Водород","Hydrogen","1.008","Неметалл",1,1,"Топливо звёзд и самый лёгкий газ во Вселенной — из него состоит три четверти всей видимой материи.","Горит почти невидимым днём пламенем, а в смеси с воздухом взрывается от малейшей искры (гремучий газ)."],
      [2,"He","Гелий","Helium","4.0026","Благородный газ",1,18,"Единственный элемент, который нашли на Солнце по спектру раньше, чем обнаружили на Земле.","Не замерзает при обычном давлении даже у абсолютного нуля, а при −271 °C становится сверхтекучим и лезет вверх по стенкам сосуда."],
      [3,"Li","Литий","Lithium","6.94","Щелочной металл",2,1,"Самый лёгкий металл на планете — в два раза легче воды, режется обычным ножом как твёрдое масло.","Сердце всех современных аккумуляторов; в воде шипит и носится по поверхности, не тонет даже в керосине."],
      [4,"Be","Бериллий","Beryllium","9.0122","Щёлочноземельный металл",2,2,"Сверхлёгкий и жёсткий металл, из которого делают зеркала космического телескопа «Джеймс Уэбб».","Почти прозрачен для рентгеновских лучей; его соли сладкие на вкус, но при этом крайне токсичны."],
      [5,"B","Бор","Boron","10.81","Полуметалл",2,13,"Тёмный, почти как алмаз твёрдый полуметалл, который держит в узде цепную реакцию в ядерных реакторах.","Его нитрид по прочности соперничает с алмазом, а соединения бора окрашивают огонь в ядовито-зелёный цвет."],
      [6,"C","Углерод","Carbon","12.011","Неметалл",2,14,"Главный конструктор жизни — образует больше соединений, чем все остальные элементы вместе взятые.","Из одних и тех же атомов складывается и мягкий грифель карандаша, и самый твёрдый природный минерал — алмаз."],
      [7,"N","Азот","Nitrogen","14.007","Неметалл",2,15,"Газ, которым мы дышим на 78% прямо сейчас, хотя организм его почти не замечает.","В чистом виде ленив, но его соединения дают и мощную взрывчатку, и главный строительный материал для белков и ДНК."],
      [8,"O","Кислород","Oxygen","15.999","Неметалл",2,16,"Окислитель, который запускает дыхание, костры и ржавчину — почти половина массы земной коры приходится на него.","В жидком виде он не прозрачный, а ярко-голубой и заметно притягивается сильным магнитом."],
      [9,"F","Фтор","Fluorine","18.998","Галоген",2,17,"Самый агрессивный химический хулиган таблицы — отбирает электроны даже у благородных газов.","В его струе загораются вода, стекло и кирпич; при этом в составе тефлона он даёт идеально скользкую и мирную посуду."],
      [10,"Ne","Неон","Neon","20.180","Благородный газ",2,18,"Газ ночных мегаполисов, который отказывается вступать в химические реакции с чем бы то ни было.","Под высоким напряжением сам по себе светится только резким красно-оранжевым — остальные цвета вывесок дают другие газы."],
      [11,"Na","Натрий","Sodium","22.990","Щелочной металл",3,1,"Мягкий серебристый металл, который на воздухе тускнеет за секунды и хранится под слоем масла.","Кусочек натрия в воде расплавляется в шарик, бегает с шипением и может взорваться; при этом его хлорид — обычная соль на столе."],
      [12,"Mg","Магний","Magnesium","24.305","Щёлочноземельный металл",3,2,"Лёгкий металл, без которого растения не смогли бы ловить солнечный свет — он сидит в центре хлорофилла.","Горит ослепительно белым пламенем и не тушится водой — наоборот, от воды вспыхивает ещё яростнее."],
      [13,"Al","Алюминий","Aluminium","26.982","Постпереходный металл",3,13,"Самый распространённый металл в земной коре — от фюзеляжей самолётов до банок для напитков.","В XIX веке стоил дороже золота: Наполеон III подавал почётным гостям алюминиевые ложки, а остальным — золотые."],
      [14,"Si","Кремний","Silicon","28.085","Полуметалл",3,14,"Фундамент всей электроники и одновременно основа обычного пляжного песка и кварца.","Для процессоров его очищают до 99,9999999% — не больше одного чужого атома на миллиард своих."],
      [15,"P","Фосфор","Phosphorus","30.974","Неметалл",3,15,"Элемент, открытый алхимиком при выпаривании вёдер мочи в поисках философского камня.","Белый фосфор светится в темноте и сам загорается на воздухе, а красный мирно работает на чиркаше спичечного коробка."],
      [16,"S","Сера","Sulfur","32.06","Неметалл",3,16,"Ярко-жёлтый камень вулканов, знакомый человечеству со времён пороха и античных легенд.","Чистая сера почти не пахнет — резкий запах тухлых яиц и вулканов дают её соединения с водородом."],
      [17,"Cl","Хлор","Chlorine","35.45","Галоген",3,17,"Тяжёлый жёлто-зелёный газ с удушливым запахом, который сделал водопроводную воду безопасной.","Тяжелее воздуха в два с половиной раза, поэтому стелется по земле; в Первую мировую стал первым боевым газом."],
      [18,"Ar","Аргон","Argon","39.948","Благородный газ",3,18,"Третий по объёму газ в воздухе (почти 1%), получивший имя от греческого слова «ленивый».","Закачивается в лампы накаливания и стеклопакеты, чтобы не давать нити сгореть и хуже пропускать холод."],
      [19,"K","Калий","Potassium","39.098","Щелочной металл",4,1,"Нервный и бурный металл, без ионов которого в теле не пройдёт ни один нервный импульс.","Вспыхивает фиолетовым пламенем сразу при касании воды; природный калий-40 делает даже бананы слегка радиоактивными."],
      [20,"Ca","Кальций","Calcium","40.078","Щёлочноземельный металл",4,2,"Строительный бетон природы: из него собраны кости, зубы, раковины, мел, мрамор и цемент.","В чистом виде это настоящий серебристый металл, который быстро сереет на воздухе и бурно пузырится в воде."],
      [21,"Sc","Скандий","Scandium","44.956","Переходный металл",4,3,"Металл, который Менделеев точно предсказал за 8 лет до открытия под именем «экабор».","Крошечная добавка в 0,5% делает алюминиевые сплавы настолько прочными, что из них варят рамы гоночных велосипедов и детали истребителей."],
      [22,"Ti","Титан","Titanium","47.867","Переходный металл",4,4,"Металл авиации, подлодок и имплантов — прочный как сталь, но почти вдвое легче неё.","Организм человека не отторгает его, а кость буквально срастается с ним; при ударе о камень даёт яркие белые искры."],
      [23,"V","Ванадий","Vanadium","50.942","Переходный металл",4,5,"Назван в честь скандинавской богини красоты Фрейи (Ванадис) за разноцветные растворы своих солей.","Делает сталь неубиваемой при ударах — именно хром-ванадиевые ключи не срываются при работе с тугими болтами."],
      [24,"Cr","Хром","Chromium","51.996","Переходный металл",4,6,"Самый твёрдый чистый металл, давший блеск автодискам и защиту нержавеющей стали.","Именно следы хрома превращают бесцветный корунд в ярко-красный рубин, а берилл — в зелёный изумруд."],
      [25,"Mn","Марганец","Manganese","54.938","Переходный металл",4,7,"Серый хрупкий металл, без которого нельзя выплавить практически ни одну тонну современной стали.","Сплав Гадфильда с марганцем при ударе не ломается, а становится ещё твёрже — из него делают гусеницы танков и решётки сейфов."],
      [26,"Fe","Железо","Iron","55.845","Переходный металл",4,8,"Металл, на котором держится цивилизация, ядро Земли и красный цвет нашей крови.","Ядерный синтез в звёздах упирается именно в железо — дальше энергия не выделяется, и звезда гибнет во вспышке сверхновой."],
      [27,"Co","Кобальт","Cobalt","58.933","Переходный металл",4,9,"Имя получил от злых горных духов кобольдов — рудокопы травились мышьяком при выплавке его руд.","Даёт легендарный глубокий «кобальтовый синий» цвет стеклу и держит форму лопаток реактивных турбин при адском жаре."],
      [28,"Ni","Никель","Nickel","58.693","Переходный металл",4,10,"Стойкий к ржавчине металл монет, струн электрогитар и железных метеоритов.","Сплав никеля с титаном (нитинол) обладает «памятью формы» — согнутая проволока сама выпрямляется в горячей воде."],
      [29,"Cu","Медь","Copper","63.546","Переходный металл",4,11,"Один из двух не серебристых металлов таблицы — жилы всей мировой электросети.","Убивает бактерии на своей поверхности за пару часов; на воздухе покрывается зелёной патиной, как Статуя Свободы."],
      [30,"Zn","Цинк","Zinc","65.38","Переходный металл",4,12,"Телохранитель стали: оцинкованные кузова и крыши не ржавеют, пока цинк принимает удар на себя.","Вместе с медью даёт латунь, а при сгибании чистого прутка цинка слышен тихий кристаллический треск."],
      [31,"Ga","Галлий","Gallium","69.723","Постпереходный металл",4,13,"Металл для фокусов и полупроводников — твёрдый на столе, но плавится при +29,8 °C прямо в ладони.","Ложка из галлия тает в чашке горячего чая, а капля галлия на алюминии за час превращает прочную банку в ломкую бумагу."],
      [32,"Ge","Германий","Germanium","72.630","Полуметалл",4,14,"Предсказанный Менделеевым «экасилиций», с которого началась эпоха первых транзисторов.","Непрозрачен для обычного света, но пропускает инфракрасный — из него точат линзы для тепловизоров."],
      [33,"As","Мышьяк","Arsenic","74.922","Полуметалл",4,15,"Самый знаменитый яд дворцовых интриг, который сегодня работает в сверхбыстрых микросхемах и лазерах.","При нагреве не плавится, а сразу испаряется в ядовитый дым с отчётливым запахом чеснока."],
      [34,"Se","Селен","Selenium","78.971","Неметалл",4,16,"Светочувствительный неметалл, благодаря которому появились первые фотоэлементы и ксероксы.","На свету его электропроводность подскакивает в сотни раз; в микродозах жизненно важен человеку, в избытке — токсичен."],
      [35,"Br","Бром","Bromine","79.904","Галоген",4,17,"Единственный неметалл, который при комнатной температуре является едкой тёмно-бурой жидкостью.","Название переводится как «зловоние» — его тяжёлые пары разъедают кожу и моментально отбивают желание подходить близко."],
      [36,"Kr","Криптон","Krypton","83.798","Благородный газ",4,18,"Редкий газ с именем «скрытый», не имеющий ничего общего с зелёным камнем из комиксов.","Даёт ослепительный белый свет в фотовспышках, а раньше по длине волны его излучения задавали эталон метра."],
      [37,"Rb","Рубидий","Rubidium","85.468","Щелочной металл",5,1,"Сверхактивный мягкий металл, названный за две яркие тёмно-красные линии в спектре.","Вспыхивает сам по себе на воздухе, а в виде паров работает в компактных атомных часах и спутниках навигации."],
      [38,"Sr","Стронций","Strontium","87.62","Щёлочноземельный металл",5,2,"Металл, который отвечает за самый сочный карминово-красный цвет фейерверков и сигнальных ракет.","Алюминат стронция накапливает дневной свет и светится в темноте до 12 часов — из него делают метки на циферблатах."],
      [39,"Y","Иттрий","Yttrium","88.906","Переходный металл",5,3,"Один из четырёх элементов, названных в честь крошечной шведской деревни Иттербю.","Его кристаллы стоят в мощных промышленных лазерах, а в соединении с цирконием дают знаменитые искусственные бриллианты — фианиты."],
      [40,"Zr","Цирконий","Zirconium","91.224","Переходный металл",5,4,"Устойчивый к кислотам и жару металл, из которого делают оболочки ядерного топлива и керамические ножи.","Почти не поглощает нейтроны; древнейший кристалл циркона, найденный в Австралии, старше 4,4 миллиарда лет."],
      [41,"Nb","Ниобий","Niobium","92.906","Переходный металл",5,5,"Тугоплавкий металл сопел космических ракет и сверхпроводящих магнитов Большого адронного коллайдера.","При анодировании покрывается оксидной плёнкой любого цвета радуги без единой капли краски."],
      [42,"Mo","Молибден","Molybdenum","95.95","Переходный металл",5,6,"Металл, который веками путали со свинцом и графитом, пока не выяснили, что он держит температуру 2623 °C.","Добавляется в броневую сталь, а его дисульфид — сухая смазка, работающая даже в вакууме космоса."],
      [43,"Tc","Технеций","Technetium","[98]","Переходный металл",5,7,"Первый искусственно созданный человеком элемент — самый лёгкий из тех, у кого нет стабильных изотопов.","Его короткоживущий изотоп Tc-99m каждый день используют в больницах по всему миру для точной диагностики органов."],
      [44,"Ru","Рутений","Ruthenium","101.07","Переходный металл",5,8,"Единственный природный элемент таблицы, открытый в России и названный в её честь (Ruthenia).","Не растворяется даже в царской водке; его сверхтонкий слой в жёстких дисках позволил в разы увеличить их объём."],
      [45,"Rh","Родий","Rhodium","102.91","Переходный металл",5,9,"Один из самых дорогих драгоценных металлов планеты — временами в несколько раз дороже золота.","Обладает зеркальным холодным блеском и абсолютно не тускнеет — им покрывают белое золото и начиняют автокатализаторы."],
      [46,"Pd","Палладий","Palladium","106.42","Переходный металл",5,10,"Серебристый металл платиновой группы, названный в честь астероида Паллада.","Работает как губка для водорода — один объём палладия способен впитать до 900 объёмов этого газа."],
      [47,"Ag","Серебро","Silver","107.87","Переходный металл",5,11,"Чемпион всей таблицы по электропроводности, теплопроводности и отражению видимого света.","Чернеет на воздухе не от кислорода, а от микроскопических примесей сероводорода; один грамм тянется в проволоку длиной 2 километра."],
      [48,"Cd","Кадмий","Cadmium","112.41","Переходный металл",5,12,"Мягкий, тяжёлый и коварно токсичный металл, из которого раньше делали никель-кадмиевые батарейки.","Его соединения дают художникам самые сочные и стойкие жёлтые и алые краски, но накапливаются в организме годами."],
      [49,"In","Индий","Indium","114.82","Постпереходный металл",5,13,"Металл, на который ты смотришь прямо сейчас: его прозрачный оксид делает сенсорным экран смартфона.","Настолько мягкий, что его можно жевать как жвачку и оставлять на нём след ногтем; при сгибании издаёт резкий «крик»."],
      [50,"Sn","Олово","Tin","118.71","Постпереходный металл",5,14,"Металл бронзового века и всех современных припоев, удерживающих детали на печатных платах.","На сильном морозе ниже −13 °C белое олово болеет «оловянной чумой» — само рассыпается в серый порошок."],
      [51,"Sb","Сурьма","Antimony","121.76","Полуметалл",5,15,"Блестящий хрупкий полуметалл, которым ещё в Древнем Египте подводили глаза.","При застывании из расплава расширяется, как вода — идеально заполняет тончайшие буквы типографских шрифтов."],
      [52,"Te","Теллур","Tellurium","127.60","Полуметалл",5,16,"Назван в честь Земли (Tellus), хотя в земной коре встречается реже платины.","Если вдохнуть микроскопическую дозу его соединений, дыхание и кожа на несколько недель приобретут стойкий запах чеснока."],
      [53,"I","Иод","Iodine","126.90","Галоген",5,17,"Тёмные металлически блестящие кристаллы, без которых щитовидная железа просто останавливается.","При лёгком нагреве минует жидкую стадию и мгновенно превращается в густой фиолетовый пар — отсюда и греческое имя."],
      [54,"Xe","Ксенон","Xenon","131.29","Благородный газ",5,18,"Тяжёлый благородный газ, ставший рабочим телом ионных двигателей космических зондов.","Светится пронзительным голубоватым светом в фарах и кинопроекторах; при вдыхании делает голос неестественно низким и басовитым."],
      [55,"Cs","Цезий","Caesium","132.91","Щелочной металл",6,1,"Золотистый сверхреактивный металл, задающий точное время для всей планеты в атомных часах.","Плавится при +28,5 °C, а при попадании даже в ледяную воду мгновенно взрывается с разбиванием стеклянной посуды."],
      [56,"Ba","Барий","Barium","137.33","Щёлочноземельный металл",6,2,"Тяжёлый металл зелёных салютов и рентгеновского контраста для желудка.","Растворимые соли бария — сильный яд, но его сульфат вообще не растворяется в кислоте, поэтому «бариевую кашу» спокойно пьют перед снимком."],
      [57,"La","Лантан","Lanthanum","138.91","Лантаноид",9,4,"Открывает семейство редкоземельных металлов; имя означает «прятаться» — химики искали его 36 лет.","Входит в состав стёкол дорогих фотообъективов и кремней для зажигалок, высекающих сноп горячих искр."],
      [58,"Ce","Церий","Cerium","140.12","Лантаноид",9,5,"Самый распространённый из редкоземельных металлов — на самом деле его в земле больше, чем меди и свинца.","Основа «кремней» в обычных зажигалках: чиркни по нему сталью, и от трения вспыхнет рой искр температурой 3000 °C."],
      [59,"Pr","Празеодим","Praseodymium","140.91","Лантаноид",9,6,"«Зелёный близнец», которого 44 года принимали за один элемент в паре с неодимом.","Делает жёлто-зелёное стекло для очков стеклодувов и сварщиков — оно наглухо гасит слепящую жёлтую вспышку натрия."],
      [60,"Nd","Неодим","Neodymium","144.24","Лантаноид",9,7,"Король современных магнитов — работает в наушниках, электромоторах, микрофонах и ветряках.","Два крупных неодимовых магнита притягиваются с такой силой, что легко ломают пальцы и раскалываются сами от удара."],
      [61,"Pm","Прометий","Promethium","[145]","Лантаноид",9,8,"Единственный полностью радиоактивный лантаноид — в природе на всей Земле его наберётся меньше килограмма.","Его соли светятся в темноте бледно-голубым светом и питают миниатюрные ядерные батарейки, работающие годами."],
      [62,"Sm","Самарий","Samarium","150.36","Лантаноид",9,9,"Первый элемент, названный в честь реального человека — русского горного инженера Василия Самарского.","Самарий-кобальтовые магниты чуть слабее неодимовых, но спокойно держат силу там, где неодим размагничивается от жара."],
      [63,"Eu","Европий","Europium","151.96","Лантаноид",9,10,"Самый химически активный и мягкий из редкоземельных металлов, защищающий банкноты евро от подделки.","В ультрафиолете его соединения вспыхивают чистым красным светом — именно так проверяют подлинность купюр."],
      [64,"Gd","Гадолиний","Gadolinium","157.25","Лантаноид",9,11,"Металл с уникальным магнитным характером, главный контрастный агент в аппаратах МРТ.","Теряет магнетизм прямо при комнатной температуре (+20 °C) и рекордно сильно поглощает тепловые нейтроны."],
      [65,"Tb","Тербий","Terbium","158.93","Лантаноид",9,12,"Ещё один «выпускник» шведской деревни Иттербю, отвечающий за сочный зелёный свет люминофоров.","Сплав тербия с железом и диспрозием (терфенол-D) заметно меняет длину в магнитном поле — его используют в мощных подводных сонарах."],
      [66,"Dy","Диспрозий","Dysprosium","162.50","Лантаноид",9,13,"Имя переводится как «труднодоступный» — химик выделил его только после тридцати с лишним попыток.","Незаменимая присадка в магнитах электромобилей: без него движок терял бы тягу при перегреве."],
      [67,"Ho","Гольмий","Holmium","164.93","Лантаноид",9,14,"Назван в честь Стокгольма (Holmia) и держит абсолютный рекорд таблицы по силе магнитного момента.","Его кристаллы меняют цвет в зависимости от лампы: при дневном свете жёлтые, а под люминесцентной — огненно-красные."],
      [68,"Er","Эрбий","Erbium","167.26","Лантаноид",9,15,"Невидимый двигатель скоростного интернета — именно им легируют подводные оптоволоконные кабели.","Усиливает световой сигнал прямо в стекле без перевода в электричество, а в стекле даёт нежный розовый оттенок."],
      [69,"Tm","Тулий","Thulium","168.93","Лантаноид",9,16,"Самый редкий из стабильных лантаноидов, названный в честь легендарного северного острова Туле.","Облучённый в реакторе тулий работает как карманный рентген-аппарат без розетки — для полевой медицины и проверки швов."],
      [70,"Yb","Иттербий","Ytterbium","173.05","Лантаноид",9,17,"Четвёртый элемент из шведской деревни Иттербю, на базе которого созданы самые точные оптические часы.","Иттербиевые часы не собьются даже на одну секунду за время, превышающее возраст всей Вселенной."],
      [71,"Lu","Лютеций","Lutetium","174.97","Лантаноид",9,18,"Самый тяжёлый, твёрдый и дорогой из редкоземельных металлов — назван по античному имени Парижа.","Помогает геологам вычислять точный возраст метеоритов, а в медицине используется для прицельного уничтожения опухолей."],
      [72,"Hf","Гафний","Hafnium","178.49","Переходный металл",6,4,"Химический двойник циркония, названный в честь Копенгагена; скрывался от учёных до 1923 года.","В отличие от циркония, жадно ловит нейтроны; его оксид работает изолятором в нанотранзисторах современных процессоров."],
      [73,"Ta","Тантал","Tantalum","180.95","Переходный металл",6,5,"Сверхстойкий металл конденсаторов внутри каждого смартфона, получивший имя из-за «мук» при растворении.","Его не берут почти никакие кислоты (кроме плавиковой), а температура плавления превышает 3000 °C."],
      [74,"W","Вольфрам","Tungsten","183.84","Переходный металл",6,6,"Рекордсмен среди всех металлов по температуре плавления (3422 °C) и прочности на разрыв.","Символ W остался от «волчьей пены» (Wolfram); плотность почти как у золота — вольфрамовый кубик ощущается нереально тяжёлым."],
      [75,"Re","Рений","Rhenium","186.21","Переходный металл",6,7,"Последний открытый стабильный элемент таблицы — один из самых редких и жаропрочных металлов планеты.","Сплавы с рением не ползут и не трескаются в соплах реактивных двигателей при температурах, плавящих обычную сталь."],
      [76,"Os","Осмий","Osmium","190.23","Переходный металл",6,8,"Самое плотное вещество на Земле: литровая бутылка осмия весила бы больше 22,5 килограммов.","Голубоватый и очень твёрдый, но его летучий оксид воняет резкой редькой и моментально обжигает глаза."],
      [77,"Ir","Иридий","Iridium","192.22","Переходный металл",6,9,"Абсолютный чемпион по стойкости к коррозии и главный «свидетель» гибели динозавров.","В земной коре его почти нет, зато полно в астероидах — тонкий слой иридия по всей планете выдал падение метеорита 66 млн лет назад."],
      [78,"Pt","Платина","Platinum","195.08","Переходный металл",6,10,"Конкистадоры презрительно звали её «серебришко» (platina) и топили в море, пока не поняли её цену.","Идеальный катализатор: пластинка платины раскаляется и поджигает водород на воздухе сама, без всякой искры."],
      [79,"Au","Золото","Gold","196.97","Переходный металл",6,11,"Космический металл, рождённый при столкновении нейтронных звёзд — не ржавеет и не тускнеет тысячелетиями.","Настолько пластично, что один грамм можно раскатать в полупрозрачный лист площадью целый квадратный метр."],
      [80,"Hg","Ртуть","Mercury","200.59","Переходный металл",6,12,"Единственный металл, который остаётся жидким при обычной температуре — «живое серебро» алхимиков.","Тяжелее свинца и железа: чугунная гиря спокойно плавает в ведре ртути, а золото в ней буквально растворяется."],
      [81,"Tl","Таллий","Thallium","204.38","Постпереходный металл",6,13,"«Яд отравителей» — мягкий металл, названный за ярко-зелёную, как молодой побег, линию в спектре.","Маскируется в организме под безвредный калий, легко проникает даже через кожу и вызывает быстрое выпадение волос."],
      [82,"Pb","Свинец","Lead","207.2","Постпереходный металл",6,14,"Тяжёлый и мягкий щит от радиации, из которого древние римляне делали трубы (отсюда символ Pb — plumbum).","Накапливается в организме и бьёт по нервной системе; из-за свинца в бензине в XX веке пришлось переходить на неэтилированное топливо."],
      [83,"Bi","Висмут","Bismuth","208.98","Постпереходный металл",6,15,"Самый красивый металл для домашней плавки — сам складывается в ступенчатые радужные кристаллы.","Самый сильный диамагнетик среди металлов (отталкивается от магнита); технически радиоактивен, но период полураспада в миллиард раз больше возраста Вселенной."],
      [84,"Po","Полоний","Polonium","[209]","Постпереходный металл",6,16,"Открыт Марией и Пьером Кюри в 1898 году и назван в честь её родины — Польши.","Из-за бешеного альфа-распада кусочек полония-210 сам разогревается до 500 °C — он грел советские «Луноходы» лунной ночью."],
      [85,"At","Астат","Astatine","[210]","Галоген",6,17,"Самый редкий природный элемент на Земле — во всей земной коре одновременно существует меньше 30 граммов.","Настолько нестабилен и горяч от распада, что если собрать видимую глазом крупинку, она мгновенно испарится сама."],
      [86,"Rn","Радон","Radon","[222]","Благородный газ",6,18,"Самый тяжёлый природный газ — невидимый, без запаха и радиоактивный, просачивается из гранитных пород.","Скапливается в непроветриваемых подвалах и на первых этажах; при заморозке до −71 °C начинает светиться жёлто-оранжевым."],
      [87,"Fr","Франций","Francium","[223]","Щелочной металл",7,1,"Последний элемент, впервые найденный в природе, а не синтезированный в ускорителе — живёт считаные минуты.","Период полураспада самого живучего изотопа — всего 22 минуты; в мире никогда не видели его в виде слитка."],
      [88,"Ra","Радий","Radium","[226]","Щёлочноземельный металл",7,2,"Металл, который в начале XX века добавляли в часы, зубную пасту и шоколад, пока не поняли цену радиации.","Светится в темноте слабым голубоватым сиянием, потому что его излучение заставляет светиться сам воздух вокруг."],
      [89,"Ac","Актиний","Actinium","[227]","Актиноид",10,4,"Родоначальник семейства актиноидов, в 150 раз более радиоактивный, чем радий.","В темноте испускает жутковатое бледно-синее свечение из-за ионизации окружающего воздуха."],
      [90,"Th","Торий","Thorium","232.04","Актиноид",10,5,"Назван в честь бога грома Тора — потенциальное ядерное топливо будущего, которого в земле втрое больше урана.","Его оксид выдерживает 3300 °C — раньше им пропитывали газовые фонари, чтобы они давали ослепительно белый свет."],
      [91,"Pa","Протактиний","Protactinium","231.04","Актиноид",10,6,"Один из самых дорогих и бесполезных в быту природных элементов — крайняя редкость и сильная радиотоксичность.","Название означает «родитель актиния», потому что распадаясь, он напрямую превращается именно в него."],
      [92,"U","Уран","Uranium","238.03","Актиноид",10,7,"Самый тяжёлый элемент, встречающийся в заметных объёмах на Земле — основа атомной энергетики.","Килограмм урана-235 при делении даёт столько же энергии, сколько эшелон из 2500 тонн угля; его соли красят стекло в неоново-зелёный."],
      [93,"Np","Нептуний","Neptunium","[237]","Актиноид",10,8,"Первый трансурановый элемент, открытый в 1940 году и названный по следующей за Ураном планете — Нептуну.","Долгое время считался только искусственным, пока его микроскопические следы не нашли прямо в урановых рудах."],
      [94,"Pu","Плутоний","Plutonium","[244]","Актиноид",10,9,"Металл атомного века и дальнего космоса — именно его распад питает «Вояджеры» и марсоход Perseverance.","У него шесть разных кристаллических состояний при нагреве; тёплый на ощупь, а при окислении превращается в самовозгорающуюся пыль."],
      [95,"Am","Америций","Americium","[243]","Актиноид",10,10,"Единственный искусственный трансурановый элемент, который вполне может висеть у тебя на потолке.","Микроскопическая крупинка америция-241 работает внутри ионизационных датчиков дыма, ловя первые частицы гари."],
      [96,"Cm","Кюрий","Curium","[247]","Актиноид",10,11,"Назван в честь Марии и Пьера Кюри — радиоактивный металл, отправленный на Марс в научных приборах.","Из-за сильного альфа-излучения растворы кюрия в темноте светятся красным, а марсоходы облучают им камни, чтобы узнать их состав."],
      [97,"Bk","Берклий","Berkelium","[247]","Актиноид",10,12,"Получен в лаборатории города Беркли в 1949 году; за всю историю мира его синтезировали чуть больше грамма.","Стал мишенью-трамплином для открытия теннессина — чтобы получить 22 миллиграмма берклия, реактор работал 250 дней."],
      [98,"Cf","Калифорний","Californium","[251]","Актиноид",10,13,"Один из самых дорогих материалов в истории человечества — миллионы долларов за один грамм.","Один микрограмм калифорния-252 испускает 170 миллионов нейтронов в минуту — им запускают ядерные реакторы и ищут нефть."],
      [99,"Es","Эйнштейний","Einsteinium","[252]","Актиноид",10,14,"Впервые обнаружен не в тихой лаборатории, а в радиоактивном пепле после первого термоядерного взрыва в 1952 году.","Назван в честь Альберта Эйнштейна; излучает столько энергии, что светится голубым и сам разрушает свою кристаллическую решётку."],
      [100,"Fm","Фермий","Fermium","[257]","Актиноид",10,15,"Юбилейный сотый элемент, тоже найденный в обломках термоядерного испытания «Айви Майк».","Последний элемент, который можно получить в ядерном реакторе — всё, что тяжелее, требует огромных ускорителей частиц."],
      [101,"Md","Менделевий","Mendelevium","[258]","Актиноид",10,16,"Назван в честь Дмитрия Менделеева — американские физики сами предложили это имя в разгар Холодной войны.","Впервые был получен буквально поштучно — 17 атомов за эксперимент, пойманных на золотую фольгу."],
      [102,"No","Нобелий","Nobelium","[259]","Актиноид",10,17,"Элемент имени Альфреда Нобеля, вокруг открытия которого десятилетиями спорили физики Швеции, США и СССР.","В итоге приоритет закрепили за лабораторией в Дубне; самый устойчивый изотоп живёт меньше часа."],
      [103,"Lr","Лоуренсий","Lawrencium","[266]","Актиноид",10,18,"Замыкает ряд актиноидов; назван в честь Эрнеста Лоуренса, изобретателя циклотрона.","Получается лишь атомами за раз, но физики всё равно умудрились измерить, как легко он отдаёт свой внешний электрон."],
      [104,"Rf","Резерфордий","Rutherfordium","[267]","Переходный металл",7,4,"Первый сверхтяжёлый трансактиноид — открыл «войну трансфермиевых элементов» между Дубной и Беркли.","В СССР его 30 лет звали «курчатовием», но в 1997 году международный союз утвердил имя Эрнеста Резерфорда."],
      [105,"Db","Дубний","Dubnium","[268]","Переходный металл",7,5,"Назван в честь подмосковного наукограда Дубна — мировой столицы синтеза сверхтяжёлых элементов.","Некоторые его изотопы живут больше суток, что для сверхтяжёлых атомов — целая вечность."],
      [106,"Sg","Сиборгий","Seaborgium","[269]","Переходный металл",7,6,"Назван в честь Гленна Сиборга — первого человека, при жизни увидевшего своё имя в таблице Менделеева.","Несмотря на секунды жизни, химики успели доказать, что он ведёт себя честно, как старший брат вольфрама."],
      [107,"Bh","Борий","Bohrium","[270]","Переходный металл",7,7,"Сверхтяжёлый металл имени Нильса Бора — отца квантовой модели атома.","В природе его нет вообще: получают столкновением ядер висмута и хрома на огромной скорости."],
      [108,"Hs","Хассий","Hassium","[277]","Переходный металл",7,8,"Получил имя от немецкой земли Гессен, где находится знаменитый ускоритель в Дармштадте.","По расчётам должен быть почти вдвое плотнее осмия — около 41 г/см³, но собрать слиток невозможно."],
      [109,"Mt","Мейтнерий","Meitnerium","[278]","Переходный металл",7,9,"Назван в честь австрийского физика Лизы Мейтнер, первой объяснившей деление ядра урана.","Единственный элемент таблицы, названный в честь женщины не из мифологии (кюрий назван сразу за обоих супругов Кюри)."],
      [110,"Ds","Дармштадтий","Darmstadtium","[281]","Переходный металл",7,10,"Сверхтяжёлый аналог платины, синтезированный в немецком Дармштадте в 1994 году.","Сначала физики в шутку предлагали назвать его «полицием» — из-за номера 110, телефона полиции в Германии."],
      [111,"Rg","Рентгений","Roentgenium","[282]","Переходный металл",7,11,"Тяжёлый родственник золота, названный в честь Вильгельма Рентгена, открывшего X-лучи.","Из-за релятивистских эффектов электронов вокруг тяжёлого ядра он, скорее всего, не жёлтый как золото, а серебристый."],
      [112,"Cn","Коперниций","Copernicium","[285]","Переходный металл",7,12,"Сверхтяжёлый сосед ртути, получивший имя Николая Коперника ровно в день его 537-летия.","Теория предсказывает, что из-за безумной скорости электронов он настолько летуч, что при комнатной температуре был бы газом."],
      [113,"Nh","Нихоний","Nihonium","[286]","Постпереходный металл",7,13,"Первый в истории элемент, открытый в Азии — японские физики назвали его в честь Японии (Нихон).","Команда RIKEN девять лет бомбардировала мишень триллионами ионов цинка, чтобы поймать всего три атома нихония."],
      [114,"Fl","Флеровий","Flerovium","[289]","Постпереходный металл",7,14,"Синтезирован в Дубне и назван в честь Лаборатории ядерных реакций имени Георгия Флёрова.","Находится прямо на пороге знаменитого «острова стабильности» и ведёт себя почти как инертный благородный газ."],
      [115,"Mc","Московий","Moscovium","[290]","Постпереходный металл",7,15,"Назван в честь Московской области, где в Дубне российско-американская группа впервые синтезировала его.","За миллисекунды распадается в нихоний; у любителей конспирологии «элемент 115» популярен как вымышленное топливо НЛО."],
      [116,"Lv","Ливерморий","Livermorium","[293]","Постпереходный металл",7,16,"Плод сотрудничества Дубны и американской Ливерморской национальной лаборатории в Калифорнии.","Живёт всего около 60 миллисекунд — меньше одного моргания глаза — и сразу превращается во флеровий."],
      [117,"Ts","Теннессин","Tennessine","[294]","Галоген",7,17,"Второй по тяжести известный элемент, названный в честь штата Теннесси, где сварили мишень из берклия.","Стоит в столбце галогенов, но из-за огромной массы ядра, вероятно, больше похож на полуметалл, чем на хлор или иод."],
      [118,"Og","Оганесон","Oganesson","[294]","Благородный газ",7,18,"Финал таблицы — назван в честь академика Юрия Оганесяна, второго человека, удостоенного этой чести при жизни.","Формально стоит среди благородных газов, но по расчётам при комнатной температуре был бы твёрдым и химически активным."]
    ];

    const ELEMENTS = RAW_ELEMENTS.map(([num, sym, ru, en, mass, cat, row, col, desc, feat]) => ({
      num, sym, ru, en, mass, cat, row, col, desc, feat
    }));

    const ptable = document.getElementById("ptable");
    const gridStage = document.getElementById("gridStage");
    const desktopCenter = document.getElementById("desktopCenter");
    const mobileInspector = document.getElementById("mobileInspector");
    const tpl = document.getElementById("inspectorTpl");
    const searchInput = document.getElementById("searchInput");
    const clearSearch = document.getElementById("clearSearch");
    const resetBtn = document.getElementById("resetBtn");
    const hudMain = document.getElementById("hudMain");
    const hudSub = document.getElementById("hudSub");

    // Mount two synced inspector instances (desktop center + mobile bottom)
    desktopCenter.appendChild(tpl.content.cloneNode(true));
    mobileInspector.appendChild(tpl.content.cloneNode(true));
    const inspectors = [desktopCenter, mobileInspector];

    const cellMap = new Map();
    let selectedNum = null;
    let activeCategory = null;
    let isScrubbing = false;

    // Classic series markers for lanthanides/actinides
    function addMarker(label, row, col) {
      const m = document.createElement("div");
      m.className = "cell-marker";
      m.textContent = label;
      m.style.gridRow = row;
      m.style.gridColumn = col;
      ptable.appendChild(m);
    }
    addMarker("57–71", 6, 3);
    addMarker("89–103", 7, 3);

    // Build all 118 cells
    const frag = document.createDocumentFragment();
    for (const el of ELEMENTS) {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.dataset.num = el.num;
      cell.dataset.cat = el.cat;
      cell.style.gridRow = el.row;
      cell.style.gridColumn = el.col;
      cell.innerHTML =
        `<div class="cell-top"><span class="cell-num">${el.num}</span><span class="cell-mass">${el.mass}</span></div>` +
        `<span class="cell-sym">${el.sym}</span>` +
        `<span class="cell-ru">${el.ru}</span>`;
      cellMap.set(el.num, cell);
      frag.appendChild(cell);
    }
    ptable.appendChild(frag);

    function padNum(n) {
      return String(n).padStart(3, "0");
    }

    function updateInspectorViews(el) {
      for (const root of inspectors) {
        const pv = root.querySelector('[data-role="portraitView"]');
        const dv = root.querySelector('[data-role="detailView"]');
        if (!el) {
          pv.classList.remove("hidden");
          dv.classList.remove("visible");
          continue;
        }
        pv.classList.add("hidden");
        dv.classList.add("visible");
        root.querySelector('[data-field="num"]').textContent = padNum(el.num);
        root.querySelector('[data-field="sym"]').textContent = el.sym;
        root.querySelector('[data-field="ru"]').textContent = el.ru;
        root.querySelector('[data-field="en"]').textContent = el.en;
        root.querySelector('[data-field="mass"]').textContent = `Ar: ${el.mass}`;
        const catBtn = root.querySelector('[data-field="cat"]');
        catBtn.textContent = el.cat;
        catBtn.classList.toggle("active", activeCategory === el.cat);
        root.querySelector('[data-field="desc"]').textContent = el.desc;
        root.querySelector('[data-field="feat"]').textContent = el.feat;
      }

      if (el) {
        hudMain.textContent = `${el.num} · ${el.sym} · ${el.ru.toUpperCase()}`;
        hudSub.textContent = `${el.cat.toUpperCase()} · Ar ${el.mass}`;
        resetBtn.classList.remove("active");
      } else {
        hudMain.textContent = "ВЕДИ ПАЛЬЦЕМ ПО СЕТКЕ";
        hudSub.textContent = "18 ГРУПП · 7 ПЕРИОДОВ";
        resetBtn.classList.add("active");
      }
    }

    function selectElement(num) {
      if (selectedNum === num) return;
      if (selectedNum !== null) {
        const prev = cellMap.get(selectedNum);
        if (prev) prev.classList.remove("active");
      }
      selectedNum = num;
      if (num === null) {
        updateInspectorViews(null);
        return;
      }
      const el = ELEMENTS[num - 1];
      if (!el) return;
      const cell = cellMap.get(num);
      if (cell) cell.classList.add("active");
      updateInspectorViews(el);
    }

    function applyFilter() {
      const q = searchInput.value.trim().toLowerCase();
      clearSearch.classList.toggle("visible", q.length > 0);

      let matches = [];
      for (const el of ELEMENTS) {
        const cell = cellMap.get(el.num);
        const matchSearch = !q ||
          String(el.num) === q ||
          el.sym.toLowerCase().includes(q) ||
          el.ru.toLowerCase().includes(q) ||
          el.en.toLowerCase().includes(q);
        const matchCat = !activeCategory || el.cat === activeCategory;

        cell.classList.toggle("dimmed", !(matchSearch && matchCat));
        cell.classList.toggle("cat-match", Boolean(activeCategory && el.cat === activeCategory));

        if (matchSearch && matchCat) matches.push(el);
      }

      if (q) {
        const exact = matches.find(
          e => String(e.num) === q || e.sym.toLowerCase() === q || e.ru.toLowerCase() === q
        );
        if (exact) selectElement(exact.num);
        else if (matches.length === 1) selectElement(matches[0].num);
      }
    }

    // Pointer click & smooth finger scrubbing across the grid
    function hitCellAt(clientX, clientY) {
      const target = document.elementFromPoint(clientX, clientY);
      if (!target) return null;
      const cell = target.closest(".cell");
      return cell ? Number(cell.dataset.num) : null;
    }

    gridStage.addEventListener("pointerdown", (e) => {
      const num = hitCellAt(e.clientX, e.clientY);
      if (num !== null) {
        isScrubbing = true;
        selectElement(num);
      }
    });

    gridStage.addEventListener("pointermove", (e) => {
      if (!isScrubbing) return;
      const num = hitCellAt(e.clientX, e.clientY);
      if (num !== null) {
        selectElement(num);
      }
    });

    window.addEventListener("pointerup", () => { isScrubbing = false; });
    window.addEventListener("pointercancel", () => { isScrubbing = false; });

    // Inspector buttons (prev / next / close / category highlight)
    for (const root of inspectors) {
      root.addEventListener("click", (e) => {
        const actionBtn = e.target.closest("[data-action]");
        if (actionBtn) {
          const act = actionBtn.dataset.action;
          if (act === "close") {
            activeCategory = null;
            selectElement(null);
            applyFilter();
          } else if (act === "prev" && selectedNum !== null) {
            selectElement(selectedNum > 1 ? selectedNum - 1 : 118);
          } else if (act === "next" && selectedNum !== null) {
            selectElement(selectedNum < 118 ? selectedNum + 1 : 1);
          }
          return;
        }
        const catBtn = e.target.closest('[data-field="cat"]');
        if (catBtn && selectedNum !== null) {
          const cat = ELEMENTS[selectedNum - 1].cat;
          activeCategory = activeCategory === cat ? null : cat;
          applyFilter();
          updateInspectorViews(ELEMENTS[selectedNum - 1]);
        }
      });
    }

    searchInput.addEventListener("input", applyFilter);
    clearSearch.addEventListener("click", () => {
      searchInput.value = "";
      activeCategory = null;
      applyFilter();
      searchInput.focus();
    });

    resetBtn.addEventListener("click", () => {
      searchInput.value = "";
      activeCategory = null;
      selectElement(null);
      applyFilter();
    });

    // Keyboard navigation on PC
    window.addEventListener("keydown", (e) => {
      if (document.activeElement === searchInput) {
        if (e.key === "Escape") searchInput.blur();
        return;
      }
      if (e.key === "Escape") {
        activeCategory = null;
        selectElement(null);
        applyFilter();
      } else if (e.key === "ArrowRight") {
        selectElement(selectedNum === null ? 1 : (selectedNum < 118 ? selectedNum + 1 : 1));
      } else if (e.key === "ArrowLeft") {
        selectElement(selectedNum === null ? 118 : (selectedNum > 1 ? selectedNum - 1 : 118));
      }
    });

    updateInspectorViews(null);
  </script>
</body>
</html>
